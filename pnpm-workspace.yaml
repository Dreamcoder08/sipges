packages:
  - apps/*
  - packages/*

# dependency-cruiser loads the TypeScript compiler optionally but does not declare it,
# so under pnpm's strict layout it cannot see it and silently skips .ts files.
packageExtensions:
  dependency-cruiser:
    peerDependencies:
      typescript: '>=5'

# Wrangler (apps/hosting-cloudflare) needs the platform binaries these install scripts fetch.
allowBuilds:
  esbuild: true
  workerd: true

# Supply-chain quarantine (world-class-local T6): a version must be public for 7 days before it
# can be installed, and dependencies may not come from git or tarball URLs. Pin an older version
# when a fresh one is refused; never add exclusions. trustPolicy: no-downgrade is left out: it
# flags semver@6.3.1, published in 2023 before npm provenance existed, as a takeover.
minimumReleaseAge: 10080
blockExoticSubdeps: true

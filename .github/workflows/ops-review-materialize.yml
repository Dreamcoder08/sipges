name: Ops - review approvals into records

# Runs `review:materialize` against production (docs/operations/review-materialize.md).
# Manual only, from main, in the `production` environment. Dry run unless `apply` is ticked;
# run the dry run first and apply only with the owner's word.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Create the records (unticked = dry run, writes nothing)'
        type: boolean
        default: false
      scope:
        description: 'One project, e.g. SIPGES/PRJ-SECHURA (empty = every project)'
        type: string
        default: ''

concurrency:
  group: ops-review-materialize
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  materialize:
    name: review:materialize (${{ inputs.apply && 'apply' || 'dry run' }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run review:materialize
        env:
          NODE_ENV: production
          SIPGES_DATABASE_URL: ${{ secrets.SIPGES_MIGRATION_DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
          SCOPE: ${{ inputs.scope }}
        run: |
          # The tool neither encrypts nor decrypts, but the API configuration requires a data key:
          # a throwaway key for this run only, never the production one.
          SIPGES_DATA_KEY="$(openssl rand -base64 32)"
          export SIPGES_DATA_KEY
          args=()
          if [ -n "$SCOPE" ]; then args+=(--scope "$SCOPE"); fi
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          pnpm --filter @sipges/api review:materialize "${args[@]}"

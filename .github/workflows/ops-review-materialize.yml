name: Ops - review approvals into records

# Runs `review-materialize` (the Rust port of `review:materialize`) against production (docs/operations/review-materialize.md).
# Manual only, from main, in the `production` environment. Dry run unless `apply` is ticked;
# run the dry run first and apply only with the owner's word.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Create the records (unticked = dry run: no records, but pending migrations still apply)'
        type: boolean
        default: false
      scope:
        description: 'One project, e.g. SIPGES/PRJ-SECHURA (empty = every project)'
        type: string
        default: ''

concurrency:
  group: ops-review-materialize
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  materialize:
    name: review-materialize (${{ inputs.apply && 'apply' || 'dry run' }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      # The Rust port (engines/crates/review-materialize, T43): same flags, output and exit codes
      # as the TypeScript tool; no Node needed. Installs the toolchain pinned in rust-toolchain.toml.
      - working-directory: engines
        run: rustup toolchain install && rustc --version
      # Release builds keyed by the toolchain channel and the lock file. This job runs only on main,
      # so it restores caches written from main, never from a pull request branch.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engines/target
          key: cargo-ops-release-${{ runner.os }}-${{ hashFiles('engines/rust-toolchain.toml', 'engines/Cargo.lock') }}
          restore-keys: cargo-ops-release-${{ runner.os }}-
      - working-directory: engines
        run: cargo build --release --locked -p sipges-review-materialize
      - name: Run review-materialize
        env:
          SIPGES_DATABASE_URL: ${{ secrets.SIPGES_MIGRATION_DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
          SCOPE: ${{ inputs.scope }}
        run: |
          # The tool neither encrypts nor decrypts, but it requires a valid data key like the API
          # configuration: a throwaway key for this run only, never the production one.
          SIPGES_DATA_KEY="$(openssl rand -base64 32)"
          export SIPGES_DATA_KEY
          args=()
          if [ -n "$SCOPE" ]; then args+=(--scope "$SCOPE"); fi
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          engines/target/release/review-materialize "${args[@]}"

name: Go

# The Go backend (apps/api-go, docs/adr/0032). Its integration tests apply the TypeScript API's SQL
# migrations to a scratch database, so a migration change runs them too. The parity job compares the
# Go API with the TypeScript API on the same database, so a TypeScript API change runs it too.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/api-go/**'
      - 'engines/go/**'
      - 'apps/api/src/**'
      - 'apps/parity/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/go.yml'

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Go changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pushes to main are filtered by paths above; a pull request always reports its checks so
          # the ruleset can require them, and a job with nothing to do is skipped, which counts as passed.
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          code=$(git diff --name-only "$BASE" HEAD | grep -E '^(apps/api-go/|engines/go/|apps/api/src/|apps/parity/|packages/|pnpm-lock\.yaml$|\.github/workflows/go\.yml$)' | head -1)
          if [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Go (vet, test, lint)
    # Repository variable SIPGES_RUNS_ON (a JSON label list) moves CI to the self-hosted runner; unset uses GitHub-hosted.
    runs-on: ${{ fromJSON(vars.SIPGES_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api-go
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        # Random host port, so two jobs can share one self-hosted machine.
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Point the tests at the PostgreSQL service
        run: echo "SIPGES_TEST_DATABASE_URL=postgres://postgres:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: apps/api-go/go.sum
      - name: Verify module checksums
        run: go mod verify
      - name: go vet
        run: go vet ./...
      # -count=1: integration tests always hit the database, never the test cache.
      - name: go test (race detector, PostgreSQL 17)
        run: go test -race -count=1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned; built from source with the Go above so it understands this module's Go version.
          version: v2.15.0
          install-mode: goinstall
          working-directory: apps/api-go

  parity:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Go/TypeScript parity (same requests, same status and JSON)
    runs-on: ${{ fromJSON(vars.SIPGES_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # The runner creates sipges_parity_<random> on this server, starts both APIs on it and drops it.
      - name: Point the runner at the PostgreSQL service
        run: echo "SIPGES_PARITY_DATABASE_URL=postgres://postgres:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: apps/api-go/go.sum
      - run: pnpm install --frozen-lockfile
      - name: pnpm parity
        run: pnpm parity

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Go image (build and smoke test)
    # GitHub-hosted on purpose: it needs Docker with buildx, which the self-hosted runner lacks.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build apps/api-go/Dockerfile (the image the Go routing Worker deploys)
        run: docker build --target runtime -f apps/api-go/Dockerfile -t sipges-api-go:ci .
      # No database needed: /health is static and the warm pool connects in the background.
      - name: Smoke test /health as the non-root image user
        run: |
          docker run -d --name api-go -p 127.0.0.1:8080:8080 \
            -e SIPGES_DATABASE_URL='postgres://synthetic@127.0.0.1:1/synthetic?connect_timeout=1' sipges-api-go:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs api-go
          exit 1

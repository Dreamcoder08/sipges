name: Rust engines

# engines/ (ADR 0032): Rust engines compiled to WebAssembly and run from Go with wazero. Runs when the
# engines, this workflow or the TypeScript engines they port (and their fixture inputs) change.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'engines/**'
      - 'apps/api-go/internal/platform/engines/wasm/**'
      - '.github/workflows/rust.yml'
      - 'apps/api/src/contexts/indicators/domain/**'
      - 'apps/api/src/contexts/analytics/domain/**'
      - 'apps/api/src/contexts/intelligence/domain/**'
      - 'apps/api/bench/synthetic.ts'
      - 'apps/api/test/indicators/python-parity.fixture.json'
      - 'packages/kernel/src/**'
      - 'apps/api/src/tools/**'
      - 'apps/api/src/platform/database/**'
      - 'apps/api/src/platform/config.ts'
      - 'apps/api/src/contexts/records/**'
      - 'apps/api/src/contexts/documents/**'
      - 'apps/api/src/contexts/identity/infrastructure/secret-cipher.ts'
      - 'apps/api/src/contexts/evidence/infrastructure/**'
      - 'apps/api/test/support/legacy-fixture.ts'
      - 'packages/contracts/src/records.ts'

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pushes to main are filtered by paths above; a pull request always reports its checks so
          # the ruleset can require them, and a job with nothing to do is skipped, which counts as passed.
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          code=$(git diff --name-only "$BASE" HEAD | grep -E '^(engines/|apps/api-go/internal/platform/engines/wasm/|\.github/workflows/rust\.yml$|apps/api/src/contexts/indicators/domain/|apps/api/src/contexts/analytics/domain/|apps/api/src/contexts/intelligence/domain/|apps/api/bench/synthetic\.ts$|apps/api/test/indicators/python-parity\.fixture\.json$|packages/kernel/src/|apps/api/src/tools/|apps/api/src/platform/database/|apps/api/src/platform/config\.ts$|apps/api/src/contexts/records/|apps/api/src/contexts/documents/|apps/api/src/contexts/identity/infrastructure/secret-cipher\.ts$|apps/api/src/contexts/evidence/infrastructure/|apps/api/test/support/legacy-fixture\.ts$|packages/contracts/src/records\.ts$)' | head -1)
          if [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  engines:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Rust engines (fmt, clippy, tests, wasm, Go host)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engines
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in engines/rust-toolchain.toml (channel, rustfmt, clippy, wasm32-wasip1).
      - run: rustup toolchain install && rustc --version && cargo --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engines/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engines/rust-toolchain.toml', 'engines/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # The PDF reader's QuickJS is C. Pinned by hash; build-wasm.sh and rquickjs-sys read WASI_SDK.
      - name: Install wasi-sdk 27
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-27/wasi-sdk-27.0-x86_64-linux.tar.gz
          echo "b7d4d944c88503e4f21d84af07ac293e3440b1b6210bfd7fe78e0afd92c23bc2  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          echo "WASI_SDK=$RUNNER_TEMP/wasi-sdk-27.0-x86_64-linux" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: engines/go/go.mod
          cache-dependency-path: engines/go/go.sum
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release --target wasm32-wasip1 -p sipges-indicators-wasm -p sipges-analytics-wasm -p sipges-pdf-text-wasm
      - run: ls -l target/wasm32-wasip1/release/sipges_indicators_wasm.wasm target/wasm32-wasip1/release/sipges_analytics_wasm.wasm target/wasm32-wasip1/release/sipges_pdf_text_wasm.wasm
      # The Go API embeds these modules; a source change must ship with the rebuilt files.
      - name: Embedded modules in apps/api-go match a reproducible build
        run: |
          ./build-wasm.sh
          git diff --exit-code --stat -- ../apps/api-go/internal/platform/engines/wasm
      - name: Go host (vet, race tests through the .wasm)
        working-directory: engines/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race -count=1 ./...

  fixtures:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Rust engine fixtures match the TypeScript engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates the fixtures from the TypeScript engines and fails on any drift.
      - run: |
          node engines/fixtures/generate.ts --check
          for engine in situational strategic consensus candidate-links integrated conflict-risk text-analysis; do
            node "engines/fixtures/$engine.ts" --check
          done
          node engines/crates/text-analysis/unicode-tables.ts --check

  tools:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # T43: the Rust operator tools against their TypeScript originals on synthetic databases
    # (engines/tools-parity). The PostgreSQL service is a throwaway CI server; no real data.
    name: Rust tools match the TypeScript tools (synthetic PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Point the harness at the PostgreSQL service
        run: echo "SIPGES_TOOLS_DATABASE_URL=postgres://postgres:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - working-directory: engines
        run: rustup toolchain install && rustc --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engines/target
          key: cargo-tools-${{ runner.os }}-${{ hashFiles('engines/rust-toolchain.toml', 'engines/Cargo.lock') }}
          restore-keys: cargo-tools-${{ runner.os }}-
      - working-directory: engines
        run: cargo build --locked -p sipges-review-materialize -p sipges-rotate-data-key -p sipges-base-maestra -p sipges-migrate-legacy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Differential runs (exit code, output and written rows)
        run: |
          node engines/tools-parity/review-materialize.ts
          node engines/tools-parity/rotate-data-key.ts
          node engines/tools-parity/base-maestra.ts
          node engines/tools-parity/migrate-legacy.ts

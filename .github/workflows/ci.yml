name: CI

# Every pull request reports the 8 required checks (the main ruleset requires them now that the repository is
# public). When a change only touches files no test reads, the `changes` job says so and each job skips its
# steps, so the checks finish green in seconds. docs/agents and docs/escenarios stay in because tooling and
# scenario tests read them. Pushes to main still skip CI entirely for those files.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'odd/**'
      - '.engram/**'
      - 'design/**'
      - 'docs/adr/**'
      - 'docs/deployment/**'
      - 'docs/operations/**'
      - 'docs/history/**'
      - 'CHANGELOG.md'
      - 'README.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pushes to main are already filtered by paths-ignore; on pull requests compare with the base commit.
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Same list as paths-ignore above; anything else counts as code.
          code=$(git diff --name-only "$BASE" HEAD | grep -vE '^(odd/|\.engram/|design/|docs/(adr|deployment|operations|history)/|CHANGELOG\.md$|README\.md$)' | head -1)
          if [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  static:
    needs: changes
    name: Static checks and non-API tests (lint, boundaries, typecheck, web, tooling)
    # Repository variable SIPGES_RUNS_ON (a JSON label list) moves CI to the self-hosted runner; unset uses GitHub-hosted.
    runs-on: ${{ fromJSON(vars.SIPGES_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v4
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Self-hosted runners keep a persistent pnpm store in their volume (docs/operations/ci-runner.md).
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.code == 'true'
        run: pnpm lint && pnpm boundaries && pnpm typecheck
      # `pnpm check` minus @sipges/api, which runs sharded in the api job below.
      - if: needs.changes.outputs.code == 'true'
        run: pnpm -r --workspace-concurrency=1 --filter '!@sipges/api' run test && pnpm test:tooling
      - if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @sipges/web build

  api:
    needs: changes
    name: API tests (shard ${{ matrix.shard }}/3)
    # Repository variable SIPGES_RUNS_ON (a JSON label list) moves CI to the self-hosted runner; unset uses GitHub-hosted.
    runs-on: ${{ fromJSON(vars.SIPGES_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        # PostGIS ships with the image so the opt-in distance test runs (docs/adr/0025).
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci-only-password
        # Random host port, so two jobs can share one self-hosted machine.
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - if: needs.changes.outputs.code == 'true'
        name: Point the tests at the PostgreSQL service
        run: echo "SIPGES_TEST_DATABASE_URL=postgres://postgres:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v4
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Self-hosted runners keep a persistent pnpm store in their volume (docs/operations/ci-runner.md).
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      # Each shard has its own PostgreSQL service, so shards share no database state.
      - if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @sipges/api exec vitest run --shard=${{ matrix.shard }}/3

  e2e:
    needs: changes
    name: End-to-end parity (Playwright, ${{ matrix.browser }} ${{ matrix.shard }})
    # Repository variable SIPGES_RUNS_ON (a JSON label list) moves CI to the self-hosted runner; unset uses GitHub-hosted.
    runs-on: ${{ fromJSON(vars.SIPGES_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Chromium splits in two shards; the short WebKit suite gets its own job.
        include:
          - { browser: chromium, shard: 1/2 }
          - { browser: chromium, shard: 2/2 }
          - { browser: webkit, shard: 1/1 }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        # Random host port, so two jobs can share one self-hosted machine.
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # The suite creates and drops its own throwaway database on this server.
      - if: needs.changes.outputs.code == 'true'
        name: Point the tests at the PostgreSQL service
        run: echo "SIPGES_E2E_DATABASE_URL=postgres://postgres:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v4
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Self-hosted runners keep a persistent pnpm store in their volume (docs/operations/ci-runner.md).
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      # Browser revision follows the @playwright/test version pinned in apps/e2e (lockfile).
      # The self-hosted image bakes the system dependencies and keeps the browsers in its volume, so it skips apt.
      - if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @sipges/e2e exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} ${{ matrix.browser }}
      - if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @sipges/web build
      - if: needs.changes.outputs.code == 'true' && matrix.browser == 'chromium'
        run: pnpm --filter @sipges/e2e exec playwright test --shard=${{ matrix.shard }}
      - if: needs.changes.outputs.code == 'true' && matrix.browser == 'webkit'
        run: pnpm --filter @sipges/e2e exec playwright test --config playwright.webkit.config.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  python-legacy:
    name: Frozen Python parity reference (pytest)
    # The frozen reference pins Python 3.12.8, which setup-python only publishes up to Ubuntu 24.04.
    runs-on: ${{ fromJSON(vars.SIPGES_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The reference is frozen: run it only when it changes, but always report the check.
      # Only the base commit is fetched (depth 1): comparing two trees needs no history.
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          [ -n "$BASE" ] && git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || git diff --name-only "$BASE" HEAD -- reference/python .github/workflows/ci.yml | grep -q .; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: reference/python/.python-version
          cache: pip
          cache-dependency-path: reference/python/requirements-test.txt
      - if: steps.changes.outputs.python == 'true'
        run: pip install -r reference/python/requirements-test.txt
      - if: steps.changes.outputs.python == 'true'
        run: PYTHONPATH=reference/python python -m pytest -q reference/python/tests

name: CI

# Every pull request reports the 8 required checks (the main ruleset requires them now that the repository is
# public). When a change only touches files no test reads, the `changes` job says so and each job skips its
# steps, so the checks finish green in seconds. docs/agents and docs/escenarios stay in because tooling and
# scenario tests read them. Pushes to main still skip CI entirely for those files.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'odd/**'
      - '.engram/**'
      - 'design/**'
      - 'docs/adr/**'
      - 'docs/deployment/**'
      - 'docs/operations/**'
      - 'docs/history/**'
      - 'CHANGELOG.md'
      - 'README.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pushes to main are already filtered by paths-ignore; on pull requests compare with the base commit.
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Same list as paths-ignore above; anything else counts as code.
          code=$(git diff --name-only "$BASE" HEAD | grep -vE '^(odd/|\.engram/|design/|docs/(adr|deployment|operations|history)/|CHANGELOG\.md$|README\.md$)' | head -1)
          if [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  static:
    needs: changes
    name: Static checks and non-API tests (lint, boundaries, typecheck, web, tooling)
    # Repository variable SIPGES_RUNS_ON (a JSON label list) moves CI to the self-hosted runner; unset uses GitHub-hosted.
    runs-on: ${{ fromJSON(vars.SIPGES_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # Self-hosted runners keep a persistent pnpm store in their volume (docs/operations/ci-runner.md).
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.code == 'true'
        run: pnpm lint && pnpm boundaries && pnpm odd:check && pnpm typecheck
      # `pnpm check` minus @sipges/api, which runs sharded in the api job below.
      - if: needs.changes.outputs.code == 'true'
        run: pnpm -r --workspace-concurrency=1 --filter '!@sipges/api' run test && pnpm test:tooling
      - if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @sipges/web build
      # Bundle size budget (closure-roadmap T32, docs/testing/budgets.md): fails when the build grows past it.
      - if: needs.changes.outputs.code == 'true'
        run: node scripts/check-bundle-budget.mjs apps/web/dist

  api:
    needs: changes
    name: API tests (shard ${{ matrix.shard }}/3)
    # Repository variable SIPGES_RUNS_ON (a JSON label list) moves CI to the self-hosted runner; unset uses GitHub-hosted.
    runs-on: ${{ fromJSON(vars.SIPGES_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        # PostGIS ships with the image so the opt-in distance test runs (docs/adr/0025).
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env:
          POSTGRES_PASSWORD: ci-only-password
        # Random host port, so two jobs can share one self-hosted machine.
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - if: needs.changes.outputs.code == 'true'
        name: Point the tests at the PostgreSQL service
        run: echo "SIPGES_TEST_DATABASE_URL=postgres://postgres:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # Self-hosted runners keep a persistent pnpm store in their volume (docs/operations/ci-runner.md).
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      # Each shard has its own PostgreSQL service, so shards share no database state.
      - if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @sipges/api exec vitest run --shard=${{ matrix.shard }}/3

  e2e:
    needs: changes
    name: End-to-end parity (Playwright, ${{ matrix.browser }} ${{ matrix.shard }})
    # Repository variable SIPGES_RUNS_ON (a JSON label list) moves CI to the self-hosted runner; unset uses GitHub-hosted.
    runs-on: ${{ fromJSON(vars.SIPGES_RUNS_ON || '"ubuntu-latest"') }}
    # Three bounded install attempts of 8 minutes must still leave time for the tests.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Chromium splits in two shards; the short WebKit suite gets its own job.
        include:
          - { browser: chromium, shard: 1/2 }
          - { browser: chromium, shard: 2/2 }
          - { browser: webkit, shard: 1/1 }
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: ci-only-password
        # Random host port, so two jobs can share one self-hosted machine.
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # The suite creates and drops its own throwaway database on this server.
      - if: needs.changes.outputs.code == 'true'
        name: Point the tests at the PostgreSQL service
        run: echo "SIPGES_E2E_DATABASE_URL=postgres://postgres:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # Self-hosted runners keep a persistent pnpm store in their volume (docs/operations/ci-runner.md).
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      # Cache key parts: the runner image (the apt packages) and the installed Playwright version
      # (the browser revision). The image version ends the key, so a new weekly image saves a fresh
      # cache, seeded from the previous image's through restore-keys, instead of reusing stale
      # packages forever. Self-hosted runners keep both in their volume and skip the cache.
      - if: needs.changes.outputs.code == 'true'
        id: playwright
        run: |
          version=$(pnpm --filter @sipges/e2e exec playwright --version | tail -n 1 | awk '{print $NF}')
          test -n "$version"
          {
            echo "version=$version"
            echo "image=${ImageOS:-unknown}-$(uname -m)"
            echo "image_version=${ImageVersion:-unknown}"
          } >> "$GITHUB_OUTPUT"
      - if: needs.changes.outputs.code == 'true' && runner.environment == 'github-hosted'
        name: Cache the Playwright browser and its apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/sipges-apt-archives
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.image_version }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}-
      # Browser revision follows the @playwright/test version pinned in apps/e2e (lockfile).
      # The self-hosted image bakes the system dependencies and keeps the browsers in its volume, so it skips apt.
      - if: needs.changes.outputs.code == 'true'
        name: Install the Playwright browser and its system packages
        run: bash scripts/ci-playwright-install.sh ${{ matrix.browser }}
        env:
          SIPGES_CI_RUNNER: ${{ runner.environment }}
          SIPGES_APT_ARCHIVES: ~/.cache/sipges-apt-archives
      - if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @sipges/web build
      - if: needs.changes.outputs.code == 'true' && matrix.browser == 'chromium'
        run: pnpm --filter @sipges/e2e exec playwright test --shard=${{ matrix.shard }}
      - if: needs.changes.outputs.code == 'true' && matrix.browser == 'webkit'
        run: pnpm --filter @sipges/e2e exec playwright test --config playwright.webkit.config.ts
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  # The same browser suite against the Go API (apps/api-go serving the built SPA itself), on a fixed
  # list of specs (docs/agents/e2e-runtimes.md): global-setup.ts builds Go, creates
  # sipges_e2e_go_<random> on the service, migrates it with the TypeScript API's SQL files and drops
  # it at the end. 03-mfa-required starts its own Node API, whatever the runtime. Not a required check.
  e2e-go:
    needs: changes
    name: End-to-end on the Go API (Playwright, chromium)
    # Repository variable SIPGES_RUNS_ON (a JSON label list) moves CI to the self-hosted runner; unset uses GitHub-hosted.
    runs-on: ${{ fromJSON(vars.SIPGES_RUNS_ON || '"ubuntu-latest"') }}
    # Bounded browser install attempts, a cold Go build (global-setup bounds it at 10 minutes) and the specs.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: ci-only-password
        # Random host port, so two jobs can share one self-hosted machine.
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SIPGES_E2E_RUNTIME: go
    steps:
      # The service's superuser creates and drops the run's throwaway database; Go accepts it only
      # because the server is on loopback (SIPGES_ALLOW_PRIVILEGED_DB_ROLE, set by the harness).
      - if: needs.changes.outputs.code == 'true'
        name: Point the tests at the PostgreSQL service
        run: echo "SIPGES_E2E_DATABASE_URL=postgres://postgres:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # Self-hosted runners keep a persistent pnpm store in their volume (docs/operations/ci-runner.md).
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      # The Go version apps/api-go/go.mod names; global-setup.ts runs `go build ./cmd/api` with it.
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      # Cache key parts: the runner image (the apt packages) and the installed Playwright version
      # (the browser revision). The image version ends the key, so a new weekly image saves a fresh
      # cache, seeded from the previous image's through restore-keys, instead of reusing stale
      # packages forever. Self-hosted runners keep both in their volume and skip the cache.
      - if: needs.changes.outputs.code == 'true'
        id: playwright
        run: |
          version=$(pnpm --filter @sipges/e2e exec playwright --version | tail -n 1 | awk '{print $NF}')
          test -n "$version"
          {
            echo "version=$version"
            echo "image=${ImageOS:-unknown}-$(uname -m)"
            echo "image_version=${ImageVersion:-unknown}"
          } >> "$GITHUB_OUTPUT"
      - if: needs.changes.outputs.code == 'true' && runner.environment == 'github-hosted'
        name: Cache the Playwright browser and its apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/sipges-apt-archives
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-chromium-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.image_version }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-chromium-${{ steps.playwright.outputs.version }}-
      - if: needs.changes.outputs.code == 'true'
        name: Install the Playwright browser and its system packages
        run: bash scripts/ci-playwright-install.sh chromium
        env:
          SIPGES_CI_RUNNER: ${{ runner.environment }}
          SIPGES_APT_ARCHIVES: ~/.cache/sipges-apt-archives
      # Go serves apps/web/dist itself (SIPGES_WEB_DIR).
      - if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @sipges/web build
      # The fixed list: 06 07 34 35 37 01 03 14 (both 03 specs).
      - if: needs.changes.outputs.code == 'true'
        run: >-
          pnpm --filter @sipges/e2e exec playwright test --project=chromium
          tests/06- tests/07- tests/34- tests/35- tests/37- tests/01- tests/03- tests/14-
      - if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-go
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          if-no-files-found: warn
          retention-days: 7

  python-legacy:
    name: Frozen Python parity reference (pytest)
    # The frozen reference pins Python 3.12.8, which setup-python only publishes up to Ubuntu 24.04.
    runs-on: ${{ fromJSON(vars.SIPGES_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The reference is frozen: run it only when it changes, but always report the check.
      # Only the base commit is fetched (depth 1): comparing two trees needs no history.
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          [ -n "$BASE" ] && git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || git diff --name-only "$BASE" HEAD -- reference/python .github/workflows/ci.yml | grep -q .; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.python == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: reference/python/.python-version
          cache: pip
          cache-dependency-path: reference/python/requirements-test.txt
      - if: steps.changes.outputs.python == 'true'
        run: pip install -r reference/python/requirements-test.txt
      - if: steps.changes.outputs.python == 'true'
        run: PYTHONPATH=reference/python python -m pytest -q reference/python/tests

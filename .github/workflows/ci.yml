name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (lint, boundaries, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MASCLI_TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @mascli/web build

  e2e:
    name: End-to-end parity (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The suite creates and drops its own throwaway database on this server.
      MASCLI_E2E_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser revision follows the @playwright/test version pinned in apps/e2e (lockfile).
      - run: pnpm --filter @mascli/e2e exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
      - run: pnpm --filter @mascli/e2e exec playwright test --config playwright.webkit.config.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  python-legacy:
    name: Frozen Python parity reference (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: reference/python/.python-version
          cache: pip
          cache-dependency-path: reference/python/requirements-test.txt
      - run: pip install -r reference/python/requirements-test.txt
      - run: PYTHONPATH=reference/python python -m pytest -q reference/python/tests

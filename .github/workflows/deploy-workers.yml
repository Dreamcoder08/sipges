name: Deploy Workers

# Publishes apps/hosting-cloudflare after CI passes on main (docs/deployment/cloudflare-workers.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate, deploy and smoke-test
    # Only a green push to main: a pull request whose branch is named `main` also matches the
    # branches filter, so the triggering event is checked too. Manual runs must target main.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # GitHub-hosted on purpose: `wrangler deploy` builds the Go image, which needs Docker with
    # buildx, and the self-hosted runner lacks it (go.yml, Go image).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI validated, not whatever main points to by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sipges/hosting-cloudflare build
      - uses: docker/setup-buildx-action@v4
      # Before the new code goes live: migrations are additive, so the running version keeps working.
      - name: Apply database migrations
        run: pnpm --filter @sipges/hosting-cloudflare migrate
        env:
          SIPGES_MIGRATION_DATABASE_URL: ${{ secrets.SIPGES_MIGRATION_DATABASE_URL }}
      # deploy:worker also re-asserts Hyperdrive query caching off (see the deployment guide).
      - name: Deploy the Worker
        run: pnpm --filter @sipges/hosting-cloudflare run deploy:worker
      # /health/ready runs SELECT 1 through Hyperdrive (5 s timeout). Like /health, it fails
      # while the migrations check or the container build fails; unlike /health, it also
      # fails when the backend is up but the database stops answering.
      - name: Smoke test /health/ready
        id: smoke
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 https://sipges.dreamcoder-dev08.workers.dev/health/ready; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 10 s"
            sleep 10
          done
          echo "Smoke test failed" >&2
          exit 1
      # /health/ready always reaches TypeScript. With routes on GO_ROUTES, this asks one of them for
      # its 401, so a dead container fails the deploy; with none it sends nothing.
      - name: Smoke test a Go route
        id: smoke_go
        run: node apps/hosting-cloudflare/smoke-go.mjs
        env:
          SIPGES_SMOKE_URL: https://sipges.dreamcoder-dev08.workers.dev
      # A failed deploy must not stay live. Rollback restores the previous Worker version only:
      # migrations are additive and stay applied. The first deploy of GoBackend cannot be rolled
      # back (docs/deployment/cloudflare-workers.md).
      - name: Roll back the Worker
        if: failure() && (steps.smoke.outcome == 'failure' || steps.smoke_go.outcome == 'failure')
        working-directory: apps/hosting-cloudflare
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          pnpm exec wrangler rollback --yes --message "Smoke test failed for ${DEPLOYED_SHA::12} (run ${GITHUB_RUN_ID})"
          echo "Rolled back to the previous version after the smoke test failed" >&2
          exit 1

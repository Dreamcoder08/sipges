name: Deploy Workers

# Publishes apps/hosting-cloudflare after CI passes on main (docs/deployment/cloudflare-workers.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate, deploy and smoke-test
    # Only a green push to main: a pull request whose branch is named `main` also matches the
    # branches filter, so the triggering event is checked too. Manual runs must target main.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI validated, not whatever main points to by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mascli/hosting-cloudflare build
      # Before the new code goes live: migrations are additive, so the running version keeps working.
      - name: Apply database migrations
        run: pnpm --filter @mascli/hosting-cloudflare migrate
        env:
          MASCLI_MIGRATION_DATABASE_URL: ${{ secrets.MASCLI_MIGRATION_DATABASE_URL }}
      # deploy:worker also re-asserts Hyperdrive query caching off (see the deployment guide).
      - name: Deploy the Worker
        run: pnpm --filter @mascli/hosting-cloudflare run deploy:worker
      - name: Smoke test /health
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 https://mascli.dreamcoder-dev08.workers.dev/health; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 10 s"
            sleep 10
          done
          echo "Smoke test failed" >&2
          exit 1

# Monthly: each Dependabot PR runs the full CI (~40 Actions minutes) on the private Free plan.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    # Dependabot uses the first group that matches, so React comes before dev-tooling.
    groups:
      # React refuses to run when react and react-dom differ by even a patch (#140).
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      react-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      dev-tooling:
        dependency-type: development
    ignore:
      # The root keeps TypeScript 6 for typescript-eslint, which does not support TS 7 yet;
      # workspaces already use TS 7. Drop this once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node types follow the Node major the runtime uses, not the newest one.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # jsdom 30 stalled the NotificationBell test, since removed; recheck before lifting this.
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']
      # WebKit in Playwright 1.64 reports CSP violations for any native <select>; 1.63 does not.
      - dependency-name: '@playwright/test'
        versions: ['1.64.x']
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directories:
      - /apps/api-go
      - /engines/go
    target-branch: main
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /engines
    target-branch: main
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ['*']
    ignore:
      # 0.1.26 carries Unicode 18 data; the engines must match Node and the toolchain, both on 17
      # (test unicode_data_versions_agree). Drop this when both move to 18.
      - dependency-name: unicode-normalization
        versions: ['>=0.1.26']

[package]
name = "sipges-indicators-wasm"
version = "0.1.0"
description = "WebAssembly ABI (JSON in, JSON out) for the SIPGES indicators engine."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sipges-indicators = { path = "../indicators" }

[lints.rust]
# The ABI shim is the only place that touches raw linear-memory pointers.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

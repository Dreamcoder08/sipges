[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# float_roundtrip: parse floats exactly like JSON.parse (correctly rounded).
# preserve_order: keep object keys in source order, as JavaScript objects do.
serde = { version = "=1.0.228", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "float_roundtrip", "preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

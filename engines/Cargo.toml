[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# float_roundtrip: parse floats exactly like JSON.parse (correctly rounded).
# preserve_order: keep object keys in source order, as JavaScript objects do.
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "float_roundtrip", "preserve_order"] }
# Operator tools (T43): synchronous PostgreSQL client; TLS through rustls with the ring provider
# and the Mozilla roots. Every version was published at least two weeks before it was pinned,
# except rusqlite 0.41.1: the owner asked for 0.41 and no 0.41 release was two weeks old yet.
postgres = { version = "=0.19.14", default-features = false, features = ["with-serde_json-1"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false }
webpki-roots = { version = "=1.0.11", default-features = false }
# AES-256-GCM and the system CSPRNG for rotate-data-key (already rustls's crypto provider).
ring = { version = "=0.17.14", default-features = false, features = ["std"] }
# migrate-legacy: the legacy SQLite files, read only, with SQLite built in rather than from the
# host; and the S3 calls of object storage, over the same rustls and ring as PostgreSQL.
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
